[project]
name = "janus"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Hoczka", email = "hoczka@proton.me" }
]
requires-python = ">=3.11"
dependencies = [
    "google-api-python-client>=2.199.0",
    "google-auth-httplib2>=0.4.2",
    "google-auth-oauthlib>=1.4.1",
]

[project.scripts]
janus = "janus:main"

[build-system]
requires = ["uv_build>=0.12.7,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
