name: CI

on:
  push:
    branches: [ "master", "main", "wt/*" ]
  pull_request:
    branches: [ "master", "main" ]

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Setup uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --dev

      - name: Verify production dependencies (no dev)
        run: |
          uv sync
          uv run python -c "import yaml; import googleapiclient; import google_auth_oauthlib; print('Production dependencies OK')"

      - name: Verify repository — run test suite
        run: uv run pytest tests/ -v

  hermes-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Janus
        uses: actions/checkout@v4
        with:
          path: janus

      - name: Checkout Hermes
        uses: actions/checkout@v4
        with:
          repository: Hoczka-git/hermes-agent
          ref: 784b2e575f3a7b44c7474153e2c6e610da70a7ba
          path: hermes-agent

      - name: Setup uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install Hermes
        working-directory: hermes-agent
        run: uv sync

      - name: Install Janus into Hermes environment
        working-directory: hermes-agent
        run: uv pip install -e ../janus

      - name: Run Janus ↔ Hermes integration tests
        working-directory: janus
        run: |
          uv run --project ../hermes-agent pytest \
            tests/plugins/test_replenishment_plugin.py -v